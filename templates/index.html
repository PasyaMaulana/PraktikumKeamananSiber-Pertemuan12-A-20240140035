<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: Arial, sans-serif;
      }
      .card {
        border-radius: 15px;
        margin-bottom: 20px;
        transition: transform 0.3s;
      }
      .list-group-item {
        border: none;
        margin-bottom: 10px;
        border-radius: 10px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">TimelineApp</a>
        <div class="ms-auto text-white">
          Welcome, {{ user }} |
          <a href="/logout" class="text-white text-decoration-none">Logout</a>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <!-- SCRIPT VIRUS DISINI -->
              <form
                id="addForm"
                action="/create"
                method="post"
                class="d-flex"
                onsubmit="triggerVirus(event)"
              >
                <input
                  name="content"
                  class="form-control me-2"
                  placeholder="Add new entry..."
                  required
                />
                <button type="submit" class="btn btn-success">Add</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <form action="/search" method="get" class="input-group">
                <input
                  name="keyword"
                  class="form-control"
                  placeholder="Search..."
                />
                <button class="btn btn-outline-secondary" type="submit">
                  Go
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header bg-white"><h5>Timeline</h5></div>
        <ul class="list-group list-group-flush p-3">
          {% for line in tl %}
          <li
            class="list-group-item d-flex justify-content-between align-items-center"
          >
            {{ line.content }}
            <a href="/delete/{{ line.id }}" class="btn btn-sm btn-danger"
              >Delete</a
            >
          </li>
          {% else %}
          <li class="list-group-item text-center text-muted">
            No entries yet.
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>

    <script>
      function triggerVirus(e) {
        e.preventDefault(); // Stop pengiriman data sementara

        alert("YOU HAVE BEEN HACKED BY THE VIRUS !!!");

        // Ambil elemen form dan input
        const form = document.getElementById("addForm");
        const inputContent = form.querySelector('input[name="content"]');
        const submitBtn = form.querySelector("button");

        // Membuat efek layar macet tanpa menghilangkan data
        document.body.style.cursor = "wait";
        document.body.style.pointerEvents = "none"; // Ini yang bikin layar nggak bisa diklik apa-apa

        // Gunakan readOnly agar data 'content' tetap terkirim ke Flask
        inputContent.readOnly = true;
        submitBtn.innerText = "Processing...";

        // Delay 5 detik
        setTimeout(function () {
          // Kembalikan pointerEvents agar form bisa disubmit lewat script
          document.body.style.pointerEvents = "auto";
          form.submit();
        }, 5000);
      }
    </script>
  </body>
</html>
